    T.text(en, 136 + kw + 16, 91, { font: FONT.latin, size: 15, weight: 500, spacing: 5, alpha: a * 0.6 });
  };
  return T;
}

// src/core/curve.js
var MANDEL_VIEW = { cx: -0.765, cy: 0, half: 1.25 };
var VS2 = HEADER + COMMON + `
layout(location=0) in float aI;      // 線分の番号
uniform float N, mode, phase, amp, morph, cardioid, width, head, trail, base, peak, grow, tcur, speedRef;
uniform vec2 res, center, ra, rb, jitter;
uniform vec3 view;                   // マンデルブロ集合の画角 (cx, cy, half)
out float vD; out float vI; out float vW;

vec2 liss(vec2 r, float s){ return vec2(sin(TAU*r.x*s), sin(TAU*r.y*s + phase)); }

// 主カージオイドと周期2の円板を、1本のつながった閉曲線としてたどる
vec2 cardioidPath(float s){
  vec2 c;
  if (s < 0.375){            // 上半分：カスプ(0.25,0) → 接点(-0.75,0)
    float th = s/0.375*PI;
    c = vec2(0.5*cos(th) - 0.25*cos(2.*th), 0.5*sin(th) - 0.25*sin(2.*th));
  } else if (s < 0.625){     // 周期2の円板を一周
    float th = (s-0.375)/0.25*TAU;
    c = vec2(-1.0 + 0.25*cos(th), 0.25*sin(th));
  } else {                   // 下半分：接点 → カスプ
    float th = PI + (s-0.625)/0.375*PI;
    c = vec2(0.5*cos(th) - 0.25*cos(2.*th), 0.5*sin(th) - 0.25*sin(2.*th));
  }
  float k = res.y/(2.0*view.z);
  return (c - view.xy)*k;    // 画面中心からのピクセル
}

vec2 P(float s){
  if (mode < 0.5){
    vec2 p = mix(liss(ra, s), liss(rb, s), morph)*amp;
    if (cardioid > 0.0) p = mix(p, cardioidPath(s), cardioid);
    return center + p;
  }
  // 波形表示（L / R チャンネル）
  float x = s*2.0-1.0;
  float y = sin(TAU*(mode < 1.5 ? ra.x : ra.y)*(x*1.5) - tcur*TAU*0.6 + (mode<1.5?0.:phase));
  return center + vec2(x*amp, y*amp*0.11);
}

void main(){
  int vid = gl_VertexID % 6;
  float s0 = aI/N, s1 = (aI+1.0)/N;
  float sg = grow;                          // 描き始め：曲線が伸びていく
  if (s0 > sg) { gl_Position = vec4(2,2,2,1); return; }
  vec2 p0 = P(s0), p1 = P(min(s1, max(sg, s0+1e-4)));
  vec2 d = p1 - p0; float L = length(d);
  vec2 t = L > 1e-5 ? d/L : vec2(1,0);
  vec2 n = vec2(-t.y, t.x);
  float hw = width*4.0;                      // 光のにじみを含めた半幅
  vec2 corner[6] = vec2[6](vec2(0,-1), vec2(1,-1), vec2(1,1), vec2(0,-1), vec2(1,1), vec2(0,1));
  vec2 cn = corner[vid];
  vec2 pos = mix(p0, p1, cn.x) + n*cn.y*hw;
  vD = cn.y*4.0;
  // ビームの頭からの距離で明るさが決まる（燐光の残像）
  float sm = mix(s0, s1, cn.x);
  float behind = fract(head - sm);
  vI = base + peak*exp(-behind/max(trail,1e-3));

  vW = width;
  pos += jitter;
  gl_Position = vec4(pos/res*2.0-1.0, 0, 1);
}`;

  float a = sdRoundBox(p, vec3(0.82), 0.22);
  vec3 q = p; q.xz *= rot(q.y*1.2);

function master(bus) {
  const N = bus.L.length;
  const hl = new HP1(28), hr = new HP1(28);
  for (let i = 0;i < N; i++) {
    bus.L[i] = hl.run(bus.L[i]);
    bus.R[i] = hr.run(bus.R[i]);
  }
  let env = 0;
  const att = Math.exp(-1 / (0.01 * SR)), rel = Math.exp(-1 / (0.2 * SR));
  const thr = Math.pow(10, -16 / 20);
  for (let i = 0;i < N; i++) {
    const x = Math.max(Math.abs(bus.L[i]), Math.abs(bus.R[i]));
    const e2 = x * x;
    env = e2 > env ? att * env + (1 - att) * e2 : rel * env + (1 - rel) * e2;
    const lvl = Math.sqrt(env);
    const g = lvl > thr ? Math.pow(lvl / thr, 1 / 2 - 1) : 1;
    bus.L[i] *= g;
    bus.R[i] *= g;
  }
  const blk = SR * 0.4;
  const pw = [];
  for (let s = 0;s + blk < N; s += blk) {
    let a = 0;
    for (let i = s;i < s + blk; i++)
      a += bus.L[i] * bus.L[i] + bus.R[i] * bus.R[i];
    pw.push(a / (2 * blk));
  }
  const gated = pw.filter((p) => p > 0.00001);
  const mean = gated.reduce((a, c) => a + c, 0) / Math.max(1, gated.length);
  const target = Math.pow(10, -15.5 / 10);
  const gain = Math.sqrt(target / mean);
  const ceil = Math.pow(10, -1.2 / 20), look = Math.round(0.002 * SR);
  let gr = 1;
  const relL = Math.exp(-1 / (0.08 * SR));
  const peak = new Float32Array(N);
  for (let i = 0;i < N; i++)
    peak[i] = Math.max(Math.abs(bus.L[i]), Math.abs(bus.R[i])) * gain;
  const L = new Float32Array(bus.L), R2 = new Float32Array(bus.R);
  for (let i = 0;i < N; i++) {
    let p = 0;
    for (let k = 0;k <= look; k += 8) {
      const j2 = i + k;
      if (j2 < N && peak[j2] > p)
        p = peak[j2];
    }
    const want = p > ceil ? ceil / p : 1;
    gr = want < gr ? want : relL * gr + (1 - relL) * want;
    const j = i;
    bus.L[j] = Math.tanh(L[j] * gain * gr / ceil * 0.98) * ceil;
    bus.R[j] = Math.tanh(R2[j] * gain * gr / ceil * 0.98) * ceil;
  }
}

// src/player.js
function player(app, canvas, params) {
  const ui = document.createElement("div");
  ui.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#f3efe8;font:300 18px "Hiragino Sans",sans-serif;background:rgba(0,0,0,.82);cursor:pointer;z-index:2;letter-spacing:.08em';
  ui.innerHTML = `<div style="font:500 44px 'Avenir Next',sans-serif;letter-spacing:.2em">▶</div><div>クリックで再生</div><div style="font-size:13px;opacity:.6">映像も音も、このページがいま計算します（素材ファイルなし）</div>`;
  document.body.appendChild(ui);
  const startAt = parseFloat(params.get("t") || "0");
  app.renderFrame(Math.round(startAt * FPS), 1);
  ui.addEventListener("click", async () => {
    ui.innerHTML = '<div>音楽を計算しています…</div><div style="font-size:13px;opacity:.6">約50万個の音符の波形を、1サンプルずつ合成中</div>';
    await new Promise((r) => setTimeout(r, 60));
    const ac = new AudioContext({ sampleRate: 48000 });
    const song = renderSong();
    const buf = ac.createBuffer(2, song.L.length, song.sr);
    buf.copyToChannel(song.L, 0);
    buf.copyToChannel(song.R, 1);
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(ac.destination);
    const t0 = ac.currentTime + 0.15;
    src.start(t0, startAt);
    ui.remove();
    const loop = () => {
      const lat = (ac.outputLatency || 0) + (ac.baseLatency || 0);
      const t = Math.max(0, ac.currentTime - t0 - lat) + startAt;
      if (t < DURATION) {
        app.renderFrame(Math.floor(t * FPS), 1);
        requestAnimationFrame(loop);
      } else {
        document.body.appendChild(ui);
        ui.innerHTML = `<div style="font:500 30px 'Avenir Next',sans-serif;letter-spacing:.2em">↻</div><div>もう一度</div>`;
        ui.onclick = () => location.reload();
      }
    };
    requestAnimationFrame(loop);
  }, { once: true });
}

var params = new URLSearchParams(location.search);
var canvas = document.getElementById("c");
async function readSource() {
  if (document.getElementById("src-main")) {
    try {
      const r = await fetch(location.href.split("?")[0]);
      if (r.ok)
        return await r.text();
    } catch (e) {}
    return `<!doctype html>
` + document.documentElement.outerHTML;
  }
  const files = [
    "index.html",
    "app.js",
    "main.js",
    "timeline.js",
    "player.js",
    "core/gl.js",
    "core/glsl.js",
    "core/post.js",
    "core/text.js",
    "core/curve.js",
    "scenes/intro.js",
    "scenes/sound.js",
    "scenes/infinity.js",
    "scenes/life.js",
    "scenes/earth.js",
    "scenes/light.js",
    "scenes/cosmos.js",
    "scenes/finale.js",
    "audio/synth.js",
    "audio/song.js"
  ];
  const parts = await Promise.all(files.map((f) => fetch(f).then((r) => r.ok ? r.text() : "").catch(() => "")));
  return parts.join(`
`);
}
(async () => {
  const source = await readSource();
  const app = await boot(canvas, { capture: params.has("capture"), source });
  window.__app = app;
  if (params.has("capture")) {
    window.__still = (t, K = 4) => {
      app.renderFrame(Math.round(t * FPS), K);
      return canvas.toDataURL("image/png");
    };
    window.__capture = async ({ from, to, K, port }) => {
      const ws = new WebSocket(`ws://localhost:${port}`);
      ws.binaryType = "arraybuffer";
      await new Promise((r) => ws.onopen = r);
      const bufs = [new Uint8Array(W * H * 4), new Uint8Array(W * H * 4)];
      let acked = from - 1;
      const waiters = [];
      ws.onmessage = () => {
        acked++;
        const w = waiters.shift();
        w && w();
      };
      const gl = app.gl;
      const t0 = performance.now();
      for (let f = from;f < to; f++) {
        while (f - acked > 2)
          await new Promise((r) => waiters.push(r));
        app.renderFrame(f, K);
        const b2 = bufs[f & 1];
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b2);
        ws.send(b2);
        if ((f - from) % 120 === 0)
          console.log(`frame ${f}/${to}  ${((performance.now() - t0) / (f - from + 1)).toFixed(1)} ms/f`);
      }
      while (acked < to - 1)
        await new Promise((r) => waiters.push(r));
      ws.close();
      return (performance.now() - t0) / 1000;
    };
    window.__ready = true;
  } else {
    player(app, canvas, params);
  }
})().catch((e) => {
  console.error(e);
  window.__error = String(e && e.stack || e);
});
